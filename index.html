<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎬 YT EXPERT STUDIO</title>
  <style>
    /* 1. 나만의 주제가 드러나는 모던 다크 테마 UI */
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      background-color: #121212; color: #e0e0e0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex; justify-content: center; padding: 20px;
    }
    .container {
      width: 100%; max-width: 650px; background-color: #1e1e1e;
      border-radius: 16px; padding: 30px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
    }
    h1 { color: #ff4a4a; text-align: center; margin: 0 0 10px; }
    .subtitle { text-align: center; color: #a0a0a0; margin-bottom: 30px; font-size: 14px; }
    h2 { color: #4dabf7; font-size: 18px; border-bottom: 1px solid #333; padding-bottom: 10px; }
    
    input {
      width: 100%; height: 46px; padding: 0 14px; margin-bottom: 10px;
      border: 1px solid #333; border-radius: 8px; background: #2c2c2c; color: white; font-size: 15px; outline: none;
    }
    input:focus { border-color: #ff4a4a; }
    
    button {
      width: 100%; border: none; border-radius: 8px; padding: 0 16px; height: 46px;
      font-size: 15px; cursor: pointer; transition: 0.2s; font-weight: bold; margin-bottom: 10px;
    }
    button:hover { opacity: 0.8; }
    .btn-red { background: #ff4a4a; color: white; }
    .btn-blue { background: #4dabf7; color: white; }
    .btn-gray { background: #555; color: white; }
    .btn-green { background: #4caf50; color: white; }
    .btn-delete { background: #ef5350; color: white; height: 36px; width: auto; font-size: 13px;}

    .auth-box { max-width: 400px; margin: 0 auto; }
    .notice {
      margin-top: 15px; padding: 12px; border-radius: 8px; background: #2a2a2a; color: #ffca28; font-size: 13px; text-align: center; line-height: 1.5;
    }

    .top-bar {
      display: flex; justify-content: space-between; align-items: center;
      background: #2a2a2a; padding: 12px 16px; border-radius: 8px; margin-bottom: 20px;
    }
    .top-bar .btn-gray { width: auto; margin-bottom: 0; height: 36px; }
    
    #result-box {
      margin-top: 15px; padding: 15px; background-color: #2c2c2c; border-radius: 8px;
      min-height: 80px; white-space: pre-wrap; line-height: 1.6; font-size: 14px;
    }
    
    .list { display: flex; flex-direction: column; gap: 12px; margin-top: 20px; }
    .item {
      background: #2a2a2a; padding: 16px; border-radius: 8px; border-left: 4px solid #4dabf7;
      display: flex; flex-direction: column; gap: 8px;
    }
    .item-query { font-weight: bold; color: #ffca28; font-size: 15px; margin:0;}
    .item-result { color: #ccc; font-size: 13px; margin:0; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .item-date { font-size: 11px; color: #777; }
    .item-actions { display: flex; justify-content: flex-end; }

    .hidden { display: none; }
    .loading-text { color: #4dabf7; text-align: center; margin: 10px 0; font-weight: bold; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎬 YT EXPERT STUDIO</h1>
    <div class="subtitle">AI 기반 유튜브 채널 정밀 진단 & 전략 컨설팅</div>

    <section id="authSection">
      <div class="auth-box">
        <input id="emailInput" type="email" placeholder="이메일 주소" />
        <input id="passwordInput" type="password" placeholder="비밀번호 (6자리 이상)" />
        <button class="btn-red" id="loginBtn">로그인</button>
        <button class="btn-blue" id="signupBtn">새 계정으로 회원가입</button>
      </div>
      <div class="notice">
        💡 처음 오셨나요? 이메일/비번 입력 후 <b>회원가입</b>을 누르세요.<br>
        이미 가입하셨다면 <b>로그인</b> 버튼을 누르시면 됩니다.
      </div>
    </section>

    <section id="mainSection" class="hidden">
      <div class="top-bar">
        <div style="font-size: 14px;">환영합니다! <br><strong id="userEmail" style="color:#4dabf7;"></strong></div>
        <button class="btn-gray" id="logoutBtn">로그아웃</button>
      </div>

      <h2>🔍 채널 전략 AI 컨설팅</h2>
      <input id="channelInput" type="text" placeholder="예: 게임 채널, 구독자 500명인데 조회수가 안 나와요." />
      <button class="btn-red" id="analyzeBtn">🚀 AI 진단 및 맞춤 전략 생성</button>
      
      <div id="loading" class="loading-text hidden">상위 1% AI 전략가가 분석 중입니다... ⏳</div>

      <div id="resultContainer" class="hidden">
        <div id="result-box"></div>
        <button class="btn-green" id="ttsBtn" style="margin-top: 10px;">🔊 AI 컨설팅 결과 음성으로 듣기 (TTS)</button>
      </div>

      <h2 style="margin-top: 40px;">📂 내 채널 컨설팅 기록</h2>
      <div id="dataList" class="list"></div>
    </section>
  </div>

  <script type="module">
    // 질문자님이 가져오신 Firebase 설정 및 모듈 가져오기
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } 
      from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
    import { getDatabase, ref, push, set, remove, onValue, off } 
      from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js';

    // 🔴 질문자님의 Firebase Config (그대로 적용됨)
    const firebaseConfig = {
      apiKey: 'AIzaSyDO-v52Ehwphh5gW0WBzu9_DliMhOzy4Yo',
      authDomain: 'kang-f4e85.firebaseapp.com',
      databaseURL: 'https://kang-f4e85-default-rtdb.firebaseio.com',
      projectId: 'kang-f4e85',
      storageBucket: 'kang-f4e85.firebasestorage.app',
      messagingSenderId: '107057126084',
      appId: '1:107057126084:web:30f7bcb3f25dd2aa4a0791',
      measurementId: 'G-DJ52YTYQZM'
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const database = getDatabase(app);

    // UI 요소 매핑
    const authSection = document.getElementById('authSection');
    const mainSection = document.getElementById('mainSection');
    const emailInput = document.getElementById('emailInput');
    const passwordInput = document.getElementById('passwordInput');
    const userEmail = document.getElementById('userEmail');
    
    const channelInput = document.getElementById('channelInput');
    const analyzeBtn = document.getElementById('analyzeBtn');
    const loading = document.getElementById('loading');
    const resultContainer = document.getElementById('resultContainer');
    const resultBox = document.getElementById('result-box');
    const ttsBtn = document.getElementById('ttsBtn');
    const dataList = document.getElementById('dataList');

    let currentUser = null;
    let currentItemsRef = null;

    // --- [1] 이메일/비밀번호 로그인 및 회원가입 ---
    function getCredentials() {
      const email = emailInput.value.trim();
      const password = passwordInput.value.trim();
      if (!email || !password) { alert('이메일과 비밀번호를 모두 입력해주세요.'); return null; }
      if (password.length < 6) { alert('비밀번호는 6자리 이상이어야 합니다.'); return null; }
      return { email, password };
    }

    document.getElementById('signupBtn').addEventListener('click', async () => {
      const cred = getCredentials(); if (!cred) return;
      try {
        await createUserWithEmailAndPassword(auth, cred.email, cred.password);
        alert('회원가입이 완료되었습니다! 시작합니다.');
      } catch (error) { alert("오류: " + error.message); }
    });

    document.getElementById('loginBtn').addEventListener('click', async () => {
      const cred = getCredentials(); if (!cred) return;
      try { await signInWithEmailAndPassword(auth, cred.email, cred.password); } 
      catch (error) { alert("로그인 실패. 이메일과 비밀번호를 확인하세요."); }
    });

    document.getElementById('logoutBtn').addEventListener('click', () => signOut(auth));

    // 로그인 상태 감지
    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUser = user;
        authSection.classList.add('hidden');
        mainSection.classList.remove('hidden');
        userEmail.textContent = user.email;
        startRealtimeDataListener(user.uid); // DB 실시간 연동 시작
      } else {
        currentUser = null;
        authSection.classList.remove('hidden');
        mainSection.classList.add('hidden');
        resultContainer.classList.add('hidden');
        stopRealtimeDataListener();
      }
    });

    // --- [2] OpenAI API 연동 (컨설팅 생성) ---
    analyzeBtn.addEventListener('click', async () => {
      const inputVal = channelInput.value.trim();
      if(!inputVal) { alert("채널 정보나 고민을 입력해주세요!"); return; }

      loading.classList.remove('hidden'); resultContainer.classList.add('hidden');

      // 🔴 주의: 여기에 이전에 알려주신 sk-proj- 로 시작하는 API 키를 넣으세요!
      const OPENAI_API_KEY = '여기에_OPENAI_API_키를_넣어주세요'; 

      try {
        const response = await fetch('https://api.openai.com/v1/chat/completions', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${OPENAI_API_KEY}` },
          body: JSON.stringify({
            model: "gpt-4o",
            messages: [
              { role: "system", content: "당신은 상위 1% 유튜브 전략가입니다. 사용자의 채널 상황에 맞춰 성장 정체 원인을 분석하고, 3초 후킹 전략 및 대박 콘텐츠 아이디어 3가지를 구체적으로 제시해주세요." },
              { role: "user", content: inputVal }
            ]
          })
        });

        const data = await response.json();
        const aiResult = data.choices[0].message.content;
        
        resultBox.textContent = aiResult;
        loading.classList.add('hidden'); resultContainer.classList.remove('hidden');

        // 결과를 파이어베이스에 저장
        saveToDatabase(inputVal, aiResult);

      } catch (error) {
        console.error(error); alert("AI 분석 중 오류가 발생했습니다. API 키를 확인해주세요.");
        loading.classList.add('hidden');
      }
    });

    // --- [3] Firebase Realtime Database 저장 및 불러오기 ---
    async function saveToDatabase(query, result) {
      if (!currentUser) return;
      try {
        const itemsRef = ref(database, `users/${currentUser.uid}/consultings`);
        const newItemRef = push(itemsRef);
        await set(newItemRef, {
          query: query,
          result: result,
          createdAt: new Date().toLocaleString('ko-KR')
        });
        channelInput.value = ''; // 입력창 초기화
      } catch (error) { console.error("저장 실패:", error); }
    }

    function startRealtimeDataListener(uid) {
      currentItemsRef = ref(database, `users/${uid}/consultings`);
      onValue(currentItemsRef, (snapshot) => {
        const data = snapshot.val();
        renderData(data);
      });
    }

    function stopRealtimeDataListener() {
      if (currentItemsRef) { off(currentItemsRef); currentItemsRef = null; }
    }

    function renderData(data) {
      dataList.innerHTML = '';
      if (!data) {
        dataList.innerHTML = '<div style="color:#777; text-align:center;">아직 저장된 컨설팅 기록이 없습니다.</div>';
        return;
      }
      // 최신순으로 정렬
      const entries = Object.entries(data).reverse();
      entries.forEach(([id, item]) => {
        const div = document.createElement('div');
        div.className = 'item';
        div.innerHTML = `
          <p class="item-query">Q. ${item.query}</p>
          <p class="item-result">${item.result}</p>
          <div class="item-date">${item.createdAt}</div>
          <div class="item-actions">
            <button class="btn-delete" onclick="deleteData('${id}')">기록 삭제</button>
          </div>
        `;
        dataList.appendChild(div);
      });
    }

    // 전역 함수로 삭제 기능 노출
    window.deleteData = async function(id) {
      if (!currentUser) return;
      if (!confirm('이 컨설팅 기록을 삭제하시겠습니까?')) return;
      try {
        await remove(ref(database, `users/${currentUser.uid}/consultings/${id}`));
      } catch (error) { alert('삭제에 실패했습니다.'); }
    };

    // --- [4] TTS (음성 합성) 기능 ---
    ttsBtn.addEventListener('click', () => {
      const textToSpeak = resultBox.textContent;
      if (!textToSpeak) return;
      window.speechSynthesis.cancel(); // 기존 음성 취소
      const utterance = new SpeechSynthesisUtterance(textToSpeak);
      utterance.lang = 'ko-KR'; 
      utterance.rate = 1.1; // 살짝 빠른 템포
      window.speechSynthesis.speak(utterance);
    });

  </script>
</body>
</html>
