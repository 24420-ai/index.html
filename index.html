<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎬 YT EXPERT STUDIO</title>
  <style>
    body {
      background-color: #121212; color: #e0e0e0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0; padding: 20px; display: flex; justify-content: center;
    }
    .container {
      width: 100%; max-width: 600px; background-color: #1e1e1e;
      padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    h1 { color: #ff4a4a; text-align: center; }
    h2 { color: #4dabf7; font-size: 1.2rem; }
    button {
      background-color: #ff4a4a; color: white; border: none; 
      padding: 10px 15px; border-radius: 5px; cursor: pointer; 
      font-weight: bold; margin-top: 10px; transition: 0.3s;
    }
    button:hover { background-color: #ff2a2a; }
    input[type="text"] {
      width: calc(100% - 22px); padding: 10px; margin-top: 10px;
      border: 1px solid #333; border-radius: 5px; background: #2c2c2c; color: white;
    }
    #result-box {
      margin-top: 20px; padding: 15px; background-color: #2c2c2c;
      border-radius: 8px; min-height: 100px; white-space: pre-wrap; line-height: 1.6;
    }
    .hidden { display: none; }
    .header-info { text-align: center; margin-bottom: 30px; color: #a0a0a0;}
  </style>
</head>
<body>

  <div class="container">
    <h1>🎬 YT EXPERT STUDIO</h1>
    <p class="header-info">AI 기반 유튜브 채널 정밀 진단 및 콘텐츠 전략 솔루션</p>

    <div id="login-section" style="text-align: center;">
      <p>서비스를 이용하려면 로그인이 필요합니다.</p>
      <button id="login-btn">🔑 구글 계정으로 로그인</button>
    </div>

    <div id="main-section" class="hidden">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <p>환영합니다, <span id="user-name" style="font-weight: bold; color: #4dabf7;"></span>님!</p>
        <button id="logout-btn" style="background-color: #555;">로그아웃</button>
      </div>

      <hr style="border-color: #333; margin: 20px 0;">

      <h2>🔍 채널 전략 컨설팅</h2>
      <p>채널 핸들이나 고민을 입력하면 AI가 맞춤 전략을 제시합니다.</p>
      <input type="text" id="channel-input" placeholder="예: 요리 채널, 구독자 1만명인데 정체기입니다.">
      <button id="analyze-btn">🚀 AI 진단 및 아이디어 추천</button>
      
      <div id="loading" class="hidden" style="margin-top: 15px; color: #4dabf7;">AI가 분석 중입니다... ⏳</div>

      <div id="result-container" class="hidden">
        <h3>💡 분석 결과</h3>
        <div id="result-box"></div>
        <button id="tts-btn" style="background-color: #4caf50; width: 100%;">🔊 결과 음성으로 듣기 (TTS)</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } 
      from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, serverTimestamp } 
      from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // 🔴 중요: 로그인을 작동시키려면 아래 값들을 본인의 Firebase 프로젝트 정보로 바꿔야 합니다!
    const firebaseConfig = {
      apiKey: "여기에_API_KEY를_넣으세요",
      authDomain: "여기에_AUTH_DOMAIN을_넣으세요",
      projectId: "여기에_PROJECT_ID를_넣으세요",
      storageBucket: "여기에_STORAGE_BUCKET을_넣으세요",
      messagingSenderId: "여기에_MESSAGING_SENDER_ID를_넣으세요",
      appId: "여기에_APP_ID를_넣으세요"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    const loginSection = document.getElementById('login-section');
    const mainSection = document.getElementById('main-section');
    const userNameSpan = document.getElementById('user-name');
    const analyzeBtn = document.getElementById('analyze-btn');
    const resultContainer = document.getElementById('result-container');
    const resultBox = document.getElementById('result-box');
    const loading = document.getElementById('loading');
    const ttsBtn = document.getElementById('tts-btn');

    document.getElementById('login-btn').addEventListener('click', () => {
      signInWithPopup(auth, provider).catch(error => {
        alert("로그인 실패! Firebase 설정이 정확한지 확인해주세요.\n에러 내용: " + error.message);
      });
    });

    document.getElementById('logout-btn').addEventListener('click', () => signOut(auth));

    onAuthStateChanged(auth, (user) => {
      if (user) {
        loginSection.classList.add('hidden'); mainSection.classList.remove('hidden');
        userNameSpan.textContent = user.displayName;
      } else {
        loginSection.classList.remove('hidden'); mainSection.classList.add('hidden');
      }
    });

    analyzeBtn.addEventListener('click', async () => {
      const inputVal = document.getElementById('channel-input').value;
      if(!inputVal) { alert("채널 정보나 고민을 입력해주세요!"); return; }

      loading.classList.remove('hidden'); resultContainer.classList.add('hidden');

      // 제공해주신 OpenAI API 키 적용 완료
      const OPENAI_API_KEY = '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'; 

      try {
        const response = await fetch('https://api.openai.com/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${OPENAI_API_KEY}`
          },
          body: JSON.stringify({
            model: "gpt-4o",
            messages: [
              { role: "system", content: "당신은 상위 1% 유튜브 전략가입니다. 사용자의 채널 상황에 맞춰 성장 정체 원인을 분석하고, 3초 후킹 전략 및 대박 콘텐츠 아이디어 3가지를 구체적으로 제시해주세요." },
              { role: "user", content: inputVal }
            ]
          })
        });

        const data = await response.json();
        const aiResult = data.choices[0].message.content;
        
        resultBox.textContent = aiResult;
        loading.classList.add('hidden'); resultContainer.classList.remove('hidden');

        saveToFirebase(auth.currentUser.uid, inputVal, aiResult);

      } catch (error) {
        console.error(error);
        alert("AI 분석 중 오류가 발생했습니다.");
        loading.classList.add('hidden');
      }
    });

    async function saveToFirebase(uid, query, result) {
      try {
        await addDoc(collection(db, "consulting_history"), {
          uid: uid, query: query, result: result, timestamp: serverTimestamp()
        });
      } catch (e) { console.error("DB 저장 실패: ", e); }
    }

    ttsBtn.addEventListener('click', () => {
      const textToSpeak = resultBox.textContent;
      if (!textToSpeak) return;
      window.speechSynthesis.cancel(); 
      const utterance = new SpeechSynthesisUtterance(textToSpeak);
      utterance.lang = 'ko-KR'; 
      window.speechSynthesis.speak(utterance);
    });

  </script>
</body>
</html>
