<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YT PD STUDIO | 대시보드</title>
  <style>
    /* 1. Streamlit 느낌의 세련된 UI 디자인 (조건 1) */
    :root {
      --yt-red: #FF0000;
      --yt-dark-red: #D32F2F;
      --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
    }

    * { box-sizing: border-box; font-family: 'Pretendard', sans-serif; }
    body { margin: 0; background: var(--bg-gradient); min-height: 100vh; padding: 20px; color: #2c3e50; }

    .container { max-width: 1100px; margin: 0 auto; }
    header { text-align: left; margin-bottom: 30px; }
    h1 { font-size: 2.5rem; margin: 0; font-weight: 800; }

    /* 메트릭 카드 영역 */
    .metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px; }
    .metric-card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
    .metric-label { font-size: 14px; color: #7f8c8d; margin-bottom: 5px; }
    .metric-value { font-size: 24px; font-weight: bold; }

    /* 레이아웃 분할 */
    .main-grid { display: grid; grid-template-columns: 1fr 1.5fr; gap: 30px; }

    /* 카드 공통 스타일 */
    .card { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); margin-bottom: 20px; }
    .card-title { font-size: 18px; font-weight: bold; margin-bottom: 20px; display: flex; align-items: center; gap: 8px; }

    /* 입력 폼 */
    input, select { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 10px; outline: none; }
    button { 
      width: 100%; padding: 15px; border-radius: 12px; border: none; font-weight: bold; cursor: pointer; 
      transition: 0.3s; color: white;
    }
    .btn-red { background: linear-gradient(to right, var(--yt-red), var(--yt-dark-red)); }
    .btn-red:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(255,0,0,0.3); }
    .btn-green { background: #27ae60; margin-top: 10px; }

    /* 프리미엄 카드 (지금 제작할 영상) */
    .next-video { border-left: 10px solid var(--yt-red); }
    .premium-badge { color: var(--yt-red); font-weight: bold; font-size: 12px; margin-bottom: 10px; }
    .video-title { font-size: 28px; margin: 10px 0; font-weight: 800; }
    .video-desc { color: #7f8c8d; font-size: 14px; line-height: 1.6; margin-bottom: 20px; }

    /* 프로그레스 바 */
    .progress-container { background: #eee; border-radius: 10px; height: 10px; overflow: hidden; margin-top: 10px; }
    .progress-bar { background: var(--yt-red); height: 100%; width: 0%; transition: 0.5s; }

    /* 파이프라인 목록 */
    .pipeline-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; margin-top: 20px; }
    .pipeline-item { background: #ebf5fb; padding: 15px; border-radius: 12px; border: 1px solid #d6eaf8; font-size: 14px; }

    .hidden { display: none; }
    #auth-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: var(--bg-gradient); display:flex; align-items:center; justify-content:center; z-index:100; }
  </style>
</head>
<body>

  <div id="auth-overlay">
    <div class="card" style="width: 350px;">
      <h2 style="text-align:center;">🎥 PD 로그인</h2>
      <input id="emailInput" type="email" placeholder="이메일 주소" />
      <input id="passwordInput" type="password" placeholder="비밀번호" />
      <button class="btn-red" id="loginBtn">시스템 접속</button>
      <button class="btn-green" id="signupBtn" style="background:#7f8c8d">신규 PD 등록</button>
    </div>
  </div>

  <div class="container hidden" id="dashboard">
    <header>
      <h1>🎬 유튜브 콘텐츠 파이프라인</h1>
      <div style="display:flex; justify-content: space-between; align-items: center;">
        <p id="userStatus" style="color:#7f8c8d;"></p>
        <button id="logoutBtn" style="width:auto; padding: 5px 15px; background:#7f8c8d; height: 30px; font-size: 12px;">로그아웃</button>
      </div>
    </header>

    <div class="metrics">
      <div class="metric-card">
        <div class="metric-label">대기 중인 아이디어</div>
        <div class="metric-value" id="waitCount">0개</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">제작 완료</div>
        <div class="metric-value" id="doneCount">0개</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">🚀 제작 열정 지수</div>
        <div class="progress-container"><div class="progress-bar" id="passionBar"></div></div>
      </div>
    </div>

    <div class="main-grid">
      <div class="side-panel">
        <div class="card">
          <div class="card-title">💡 아이디어 뱅크</div>
          <p style="font-size:13px; color:#777;">주제를 입력하면 AI가 기획안을 작성합니다.</p>
          <input id="topicInput" type="text" placeholder="예: 2026년 자취 꿀템" />
          <select id="categorySelect">
            <option value="쇼츠">쇼츠 (Shorts)</option>
            <option value="리뷰">리뷰/언박싱</option>
            <option value="브이로그">브이로그</option>
          </select>
          <button class="btn-red" id="aiGenBtn">🚀 AI 기획안 생성 및 추가</button>
        </div>
      </div>

      <div class="main-panel">
        <div id="targetCard" class="card next-video hidden">
          <div class="premium-badge">PREMIUM CONTENT PLAN</div>
          <h1 class="video-title" id="nowTitle">🔥 제목 없음</h1>
          <div class="video-desc" id="nowDesc">아이디어를 추가하면 AI 분석 내용이 여기에 표시됩니다.</div>
          
          <div style="display: flex; gap: 10px;">
            <button class="btn-red" id="completeBtn">✅ 제작 완료 및 업로드</button>
            <button class="btn-green" id="ttsBtn">🔊 AI 보이스 브리핑</button>
          </div>
        </div>
        <div id="emptyNotice" class="card" style="text-align:center; color:#999; padding: 50px;">
          모든 영상을 업로드했습니다! <br>새로운 아이디어를 추가해 주세요.
        </div>
      </div>
    </div>

    <div class="card" style="margin-top:30px;">
      <div class="card-title">🛤️ 제작 프로세스 맵 (전체 목록)</div>
      <div id="pipeline" class="pipeline-grid"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
    import { getDatabase, ref, push, set, onValue, remove, update } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js';

    // 🔴 파이어베이스 설정 (본인 것으로 교체 권장)
    const firebaseConfig = {
      apiKey: 'AIzaSyDO-v52Ehwphh5gW0WBzu9_DliMhOzy4Yo',
      authDomain: 'kang-f4e85.firebaseapp.com',
      databaseURL: 'https://kang-f4e85-default-rtdb.firebaseio.com',
      projectId: 'kang-f4e85',
      storageBucket: 'kang-f4e85.firebasestorage.app',
      messagingSenderId: '107057126084',
      appId: '1:107057126084:web:30f7bcb3f25dd2aa4a0791'
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    let currentUser = null;
    let queue = [];

    // --- [로그인/회원가입 로직] ---
    document.getElementById('loginBtn').onclick = async () => {
      const email = document.getElementById('emailInput').value;
      const pw = document.getElementById('passwordInput').value;
      try { await signInWithEmailAndPassword(auth, email, pw); } catch(e) { alert("로그인 실패!"); }
    };

    document.getElementById('signupBtn').onclick = async () => {
      const email = document.getElementById('emailInput').value;
      const pw = document.getElementById('passwordInput').value;
      try { await createUserWithEmailAndPassword(auth, email, pw); alert("PD 등록 완료!"); } catch(e) { alert(e.message); }
    };

    document.getElementById('logoutBtn').onclick = () => signOut(auth);

    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUser = user;
        document.getElementById('auth-overlay').classList.add('hidden');
        document.getElementById('dashboard').classList.remove('hidden');
        document.getElementById('userStatus').innerText = `접속중: ${user.email}`;
        loadData();
      } else {
        document.getElementById('auth-overlay').classList.remove('hidden');
        document.getElementById('dashboard').classList.add('hidden');
      }
    });

    // --- [데이터 베이스 연동 (조건 2)] ---
    function loadData() {
      onValue(ref(db, `users/${currentUser.uid}/queue`), (snap) => {
        const data = snap.val();
        queue = data ? Object.entries(data).map(([id, val]) => ({id, ...val})) : [];
        renderDashboard();
      });
      // 완료 카운트 연동
      onValue(ref(db, `users/${currentUser.uid}/stats`), (snap) => {
        const stats = snap.val() || { done: 0 };
        document.getElementById('doneCount').innerText = `${stats.done}개`;
        document.getElementById('passionBar').style.width = `${Math.min(stats.done * 10, 100)}%`;
      });
    }

    // --- [AI 생성 로직 (OpenAI)] ---
    document.getElementById('aiGenBtn').onclick = async () => {
      const topic = document.getElementById('topicInput').value;
      const cat = document.getElementById('categorySelect').value;
      if(!topic) return alert("주제를 입력하세요!");

      const btn = document.getElementById('aiGenBtn');
      btn.innerText = "AI 작가 구성 중..."; btn.disabled = true;

      // 🔴 여기에 OpenAI API 키를 넣으세요
      const API_KEY = 'sk-proj-본인키입력'; 

      try {
        const resp = await fetch('https://api.openai.com/v1/chat/completions', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${API_KEY}` },
          body: JSON.stringify({
            model: "gpt-4o-mini",
            messages: [{role: "system", content: "유튜브 PD입니다. 주제에 대해 한 문장의 제목과 세 문장 정도의 제작 기획안을 써주세요."}, {role: "user", content: topic}]
          })
        });
        const json = await resp.json();
        const aiText = json.choices[0].message.content;

        // DB에 저장
        push(ref(db, `users/${currentUser.uid}/queue`), {
          title: `[${cat}] ${topic}`,
          desc: aiText,
          time: new Date().toLocaleString()
        });
        document.getElementById('topicInput').value = "";
      } catch(e) {
        alert("AI 연동에 실패했습니다. 키를 확인하세요!");
      } finally {
        btn.innerText = "🚀 AI 기획안 생성 및 추가"; btn.disabled = false;
      }
    };

    // --- [화면 업데이트] ---
    function renderDashboard() {
      document.getElementById('waitCount').innerText = `${queue.length}개`;
      const pipeline = document.getElementById('pipeline');
      pipeline.innerHTML = "";

      if(queue.length > 0) {
        document.getElementById('targetCard').classList.remove('hidden');
        document.getElementById('emptyNotice').classList.add('hidden');
        document.getElementById('nowTitle').innerText = queue[0].title;
        document.getElementById('nowDesc').innerText = queue[0].desc;

        queue.forEach((item, idx) => {
          const div = document.createElement('div');
          div.className = 'pipeline-item';
          div.innerHTML = `<strong>${idx+1}순위</strong><br>${item.title}`;
          pipeline.appendChild(div);
        });
      } else {
        document.getElementById('targetCard').classList.add('hidden');
        document.getElementById('emptyNotice').classList.remove('hidden');
      }
    }

    // 제작 완료 버튼
    document.getElementById('completeBtn').onclick = () => {
      const targetId = queue[0].id;
      remove(ref(db, `users/${currentUser.uid}/queue/${targetId}`));
      
      const statsRef = ref(db, `users/${currentUser.uid}/stats`);
      onValue(statsRef, (snap) => {
        const currentDone = (snap.val() ? snap.val().done : 0);
        update(statsRef, { done: currentDone + 1 });
      }, { onlyOnce: true });

      confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
    };

    // TTS 음성 (조건 5)
    document.getElementById('ttsBtn').onclick = () => {
      const text = document.getElementById('nowDesc').innerText;
      speechSynthesis.cancel();
      const msg = new SpeechSynthesisUtterance(text);
      msg.lang = 'ko-KR';
      msg.rate = 1.1;
      speechSynthesis.speak(msg);
    };
  </script>
</body>
</html>
